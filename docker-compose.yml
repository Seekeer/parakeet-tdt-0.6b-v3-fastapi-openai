services:
  parakeet:
    build: .
    image: parakeet-tdt:cpu
    container_name: parakeet
    environment:
      # Comma-separated client keys; put them in .env (see .env.example).
      PARAKEET_API_KEYS: ${PARAKEET_API_KEYS:?set PARAKEET_API_KEYS in .env}
      PARAKEET_DEFAULT_MODEL: parakeet-tdt-0.6b-v3
    ports:
      - "5092:5092"
    volumes:
      - parakeet-models:/app/models
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  parakeet-models:
    name: parakeet-models
