name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -t parakeet-tdt:ci .
      - name: Smoke-test image imports and auth fail-closed
        run: |
          docker run --rm -e PARAKEET_API_KEYS=ci-key-0123456789abcdef parakeet-tdt:ci \
            python -c "import parakeet_service.main; import torch; assert torch.version.cuda is None"
          if docker run --rm parakeet-tdt:ci python -c "import parakeet_service.config"; then
            echo "config imported without API keys"; exit 1
          fi
