name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q

  # Builds and smoke-tests the image on every run; pushes that same image to
  # GHCR only for main and v* tags (never for pull requests or other branches).
  docker-image:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Only the default branch moves `latest`; semver tags must not.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: parakeet-tdt:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image imports and auth fail-closed
        run: |
          docker run --rm -e PARAKEET_API_KEYS=ci-key-0123456789abcdef parakeet-tdt:ci \
            python -c "import parakeet_service.main; import torch; assert torch.version.cuda is None"
          if docker run --rm parakeet-tdt:ci python -c "import parakeet_service.config"; then
            echo "config imported without API keys"; exit 1
          fi
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the exact image that passed the smoke test instead of rebuilding.
      # `latest` moves only while this commit is still the head of main, so
      # out-of-order runs or re-runs of old commits cannot roll it back.
      - name: Push image
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          main_head=$(git ls-remote origin refs/heads/main | cut -f1)
          for tag in $TAGS; do
            if [[ "$tag" == *:latest && "$main_head" != "$GITHUB_SHA" ]]; then
              echo "Skipping $tag: $GITHUB_SHA is no longer the head of main ($main_head)"
              continue
            fi
            docker tag parakeet-tdt:ci "$tag"
            docker push "$tag"
          done
